server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: codeforge-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:codeforge_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
    password: ${MYSQL_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION:86400000} # 24 Hours

# Code Execution Sandbox Settings
codeforge:
  execution:
    docker-enabled: ${DOCKER_ENABLED:true} # Runs in Docker when Docker daemon is present, with safe isolated local fallback
    timeout-ms: ${EXECUTION_TIMEOUT:5000}
    temp-dir: ./temp-submissions
    memory-limit-mb: ${MEMORY_LIMIT:256}
