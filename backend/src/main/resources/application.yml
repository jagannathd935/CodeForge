server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: codeforge-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:${MYSQL_PORT:3307}/codeforge_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

# JWT Configuration
app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 Hours

# Code Execution Sandbox Settings
codeforge:
  execution:
    docker-enabled: true # Automatically runs in Docker when Docker daemon is present, with safe fallback
    timeout-ms: 5000
    temp-dir: ./temp-submissions
