version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: codeforge-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: codeforge_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql:ro
    networks:
      - codeforge-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codeforge-backend
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/codeforge_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: codeforge_db
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ""
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      JWT_EXPIRATION: 86400000
      DOCKER_ENABLED: "false"
      EXECUTION_TIMEOUT: 5000
      MEMORY_LIMIT: 256
    ports:
      - "8080:8080"
    networks:
      - codeforge-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codeforge-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - codeforge-net

networks:
  codeforge-net:
    driver: bridge

volumes:
  mysql-data:
